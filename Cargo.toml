[workspace]
members = ["auxcov", "auxtools", "auxtools-impl", "debug_server", "instruction_hooking", "tests/auxtest", "tests/byond_get", "tests/debug_test", "tests/hot_reload_test", "tests/launcher_test", "tests/test_runner", "tools/debug_client", "tools/hot_reload", "tools/auxtools-cli"]
default-members = ["tools/auxtools-cli"]
resolver = "2"

[workspace.package]
authors = ["Sophie Wallace <sophie@wiox.me>", "Lucy <lucy@absolucy.moe>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/wilox/auxtools"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
lazy_static = "1"
retour = { version = "=0.4.0-alpha.4", default-features = false }
dmasm = { git = "https://github.com/sohpea-cloub/dmasm", branch = "hot-reload", features = ["serde"] }
byond-scan = { git = "https://github.com/Absolucy/byond-scan" }

# dmasm's proc compiler needs parser fixes that aren't in a SpacemanDMM
# release yet; scripts/setup-spacemandmm.sh makes this checkout
[patch."https://github.com/SpaceManiac/SpacemanDMM"]
dreammaker = { path = "../SpacemanDMM/crates/dreammaker" }
dap-types = { path = "../SpacemanDMM/crates/dap-types" }

[workspace.lints.rust]
static_mut_refs = "allow"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
missing_safety_doc = "allow"
missing_transmute_annotations = "allow"
type_complexity = "allow"

[profile.release]
opt-level = 3
lto = 'thin'
codegen-units = 1
incremental = true
debug = true

# Finding BYOND's functions scans its code once per pattern, which takes tens
# of seconds unoptimised, at the start of every world a dev build debugs
[profile.dev.package.byond-scan]
opt-level = 3
