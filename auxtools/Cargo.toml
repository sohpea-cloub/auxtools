[package]
name = "auxtools"
description = "Hook DM procs and work with BYOND values from Rust"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version = "1.88"
repository.workspace = true
license.workspace = true

[build-dependencies]
cc = "1.0"

[dependencies]
auxtools-impl = { path = "../auxtools-impl", version = "0.1.0", package = "auxtools-impl" }
byond-scan = { workspace = true }
inventory = "0.3"
ahash = "0.8"
fxhash = "0.2"
ctor = "0.2"
retour = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["libloaderapi"] }

[lints]
workspace = true
